services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cumplia
      POSTGRES_PASSWORD: cumplia
      POSTGRES_DB: cumplia
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Crea el usuario sin privilegios de la API (solo con un volumen nuevo).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
volumes:
  db_data:
