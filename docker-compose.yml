services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cumplia
      POSTGRES_PASSWORD: cumplia
      POSTGRES_DB: cumplia
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Crea el usuario sin privilegios de la API (solo con un volumen nuevo).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  # Solo desarrollo: atrapa todos los emails (no salen a internet).
  # Bandeja en http://localhost:8025 · SMTP en localhost:1025
  mail:
    image: axllent/mailpit:v1.31.3
    ports:
      - "8025:8025"
      - "1025:1025"

  # Solo desarrollo: almacenamiento compatible con S3 para los archivos de evidencia.
  # S3 en http://localhost:8333 (credenciales de docker/seaweedfs/s3.json).
  files:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - files_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  db_data:
  files_data:
